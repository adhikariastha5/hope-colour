<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What Colour is Hope?</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #050505;
      color: #fff;
      overflow: hidden;
    }

    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: clamp(0.75rem, 3vw, 1.5rem);
      transition: background-color 0.35s ease;
    }

    /* Video feeds MediaPipe only — invisible; soft hand dots on #handCanvas */
    .sr-only-video {
      position: fixed;
      width: 640px;
      height: 480px;
      top: 0;
      left: 0;
      opacity: 0;
      pointer-events: none;
      z-index: 0;
    }

    #handCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .hint {
      position: relative;
      z-index: 2;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      text-align: center;
      font-size: 0.88rem;
      line-height: 1.45;
      max-width: 26rem;
      padding: 0 0.5rem;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
      opacity: 0.92;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
      z-index: 10;
    }

    #overlay[hidden] {
      display: none;
    }

    #overlay h1 {
      font-size: clamp(1.75rem, 5vw, 2.65rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 1.1rem;
      text-wrap: balance;
      text-shadow: 0 2px 24px rgba(0, 0, 0, 0.5);
    }

    #overlay p {
      font-size: clamp(1rem, 2.6vw, 1.28rem);
      line-height: 1.5;
      max-width: 22em;
      text-wrap: balance;
      opacity: 0.96;
      text-shadow: 0 1px 16px rgba(0, 0, 0, 0.45);
    }

    .error-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 0.65rem 1rem;
      background: #2a1515;
      color: #f5d4d4;
      text-align: center;
      font-size: 0.85rem;
      z-index: 20;
    }
  </style>
</head>
<body>

<div id="err" class="error-banner" hidden></div>

<div id="stage" aria-label="Colour stage">
  <video id="video" class="sr-only-video" playsinline muted></video>
  <canvas id="handCanvas" aria-hidden="true"></canvas>
  <p id="hint" class="hint">Close your fist to choose.</p>
</div>

<div id="overlay" hidden>
  <h1>Your colour hope</h1>
  <p id="overlayLine"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
(function () {
  const stage = document.getElementById('stage');
  const video = document.getElementById('video');
  const handCanvas = document.getElementById('handCanvas');
  const handCtx = handCanvas.getContext('2d');
  const hintEl = document.getElementById('hint');
  const overlay = document.getElementById('overlay');
  const overlayLine = document.getElementById('overlayLine');
  const errEl = document.getElementById('err');

  const STORAGE_KEY = 'hopeGallery';
  const LAST_KEY = 'hopeLast';
  const SYNC_CHANNEL = 'hope-colour-exhibit';

  let syncBc = null;
  try {
    syncBc = new BroadcastChannel(SYNC_CHANNEL);
  } catch (_) {}

  let locked = false;
  let handVisible = false;
  let handX = 0.5;
  let handY = 0.5;

  let currentHue = 200;
  let currentSat = 62;
  let currentLight = 48;

  let landmarks = null;
  let fistClosed = false;
  let lastFist = false;
  let cameraReady = false;

  /**
   * Many fixed “families” (hue + S/L combos) — golden-angle step so
   * consecutive indices look very different (not red → pink → white).
   */
  const DISTINCT_PALETTE = (function () {
    const n = 240;
    const GOLD = 137.508;
    const SL = [
      [90, 36], [76, 44], [88, 32], [68, 48], [92, 40], [58, 42],
      [84, 50], [72, 34], [95, 38], [64, 46], [80, 52], [70, 40],
      [86, 30], [74, 48], [91, 42], [62, 44], [88, 36], [78, 50],
    ];
    const out = [];
    for (let i = 0; i < n; i++) {
      const h = (i * GOLD) % 360;
      const [s, l] = SL[i % SL.length];
      out.push({ h, s, l });
    }
    return out;
  })();

  const GRID_COLS = 14;
  const GRID_ROWS = 10;
  let lastCellKey = null;
  let kbdIdx = 0;

  function cellToPaletteIndex(ix, iy) {
    const linear = ix + iy * GRID_COLS;
    const N = DISTINCT_PALETTE.length;
    const mixed = (linear * 71 + iy * 17 + ix * 37) % N;
    return mixed < 0 ? mixed + N : mixed;
  }

  function applyPaletteIndex(pi) {
    const c = DISTINCT_PALETTE[((pi % DISTINCT_PALETTE.length) + DISTINCT_PALETTE.length) % DISTINCT_PALETTE.length];
    currentHue = c.h;
    currentSat = c.s;
    currentLight = c.l;
    applyBackground();
  }

  function resizeHandCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    handCanvas.width = Math.floor(window.innerWidth * dpr);
    handCanvas.height = Math.floor(window.innerHeight * dpr);
    handCanvas.style.width = `${window.innerWidth}px`;
    handCanvas.style.height = `${window.innerHeight}px`;
    handCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function drawSoftDot(x, y, r, fillRgba) {
    handCtx.beginPath();
    handCtx.arc(x, y, r, 0, Math.PI * 2);
    handCtx.fillStyle = fillRgba;
    handCtx.shadowColor = `hsla(${currentHue}, 90%, 72%, 0.5)`;
    handCtx.shadowBlur = r * 2.4;
    handCtx.fill();
    handCtx.shadowBlur = 0;
  }

  /** Fingertip jewels + palm ring — like the old canvas, no wire skeleton */
  function drawHandOverlay() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    handCtx.clearRect(0, 0, w, h);
    if (!landmarks || !handVisible) return;

    const palm = landmarks[9];
    const cx = (1 - palm.x) * w;
    const cy = palm.y * h;

    const fistTips = [8, 12, 16, 20];
    const drawTips = [4, 8, 12, 16, 20];
    const avgDist = fistTips.reduce(
      (sum, i) => sum + Math.hypot(landmarks[i].x - palm.x, landmarks[i].y - palm.y),
      0
    ) / 4;
    const t = Math.max(0, Math.min(1, 1 - avgDist / 0.16));
    const dotCol = `hsla(${currentHue}, 78%, 88%, ${0.38 + t * 0.55})`;
    const ringCol = `hsla(${currentHue}, 82%, 92%, ${0.28 + t * 0.72})`;

    const tipRadius = Math.max(3.2, Math.min(6.5, Math.hypot(w, h) * 0.006)) + t * 2.2;

    drawTips.forEach(i => {
      const fx = (1 - landmarks[i].x) * w;
      const fy = landmarks[i].y * h;
      drawSoftDot(fx, fy, tipRadius, dotCol);
    });

    const ringR = 18 + (1 - t) * 16;
    handCtx.beginPath();
    handCtx.arc(cx, cy, ringR, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(t, 0.04));
    handCtx.strokeStyle = ringCol;
    handCtx.lineWidth = 2 + t * 2;
    handCtx.lineCap = 'round';
    handCtx.stroke();

    const palmR = 5 + t * 3.2;
    drawSoftDot(cx, cy, palmR, dotCol);

    const thin = `hsla(${currentHue}, 70%, 92%, ${0.22 + t * 0.35})`;
    handCtx.strokeStyle = thin;
    handCtx.lineWidth = 1;
    handCtx.beginPath();
    handCtx.moveTo(cx - 22, cy);
    handCtx.lineTo(cx - 12, cy);
    handCtx.moveTo(cx + 12, cy);
    handCtx.lineTo(cx + 22, cy);
    handCtx.moveTo(cx, cy - 22);
    handCtx.lineTo(cx, cy - 12);
    handCtx.moveTo(cx, cy + 12);
    handCtx.lineTo(cx, cy + 22);
    handCtx.stroke();
  }

  function applyBackground() {
    stage.style.backgroundColor = `hsl(${currentHue}, ${currentSat}%, ${currentLight}%)`;
  }

  function updateLiveColourFromHand() {
    if (locked) return;
    const ix = Math.min(GRID_COLS - 1, Math.max(0, Math.floor(handX * GRID_COLS)));
    const iy = Math.min(GRID_ROWS - 1, Math.max(0, Math.floor(handY * GRID_ROWS)));
    const key = `${ix}:${iy}`;
    if (key === lastCellKey) return;
    lastCellKey = key;
    const pi = cellToPaletteIndex(ix, iy);
    kbdIdx = pi;
    applyPaletteIndex(pi);
  }

  function randomSimilarityPercent() {
    return 44 + Math.floor(Math.random() * 49);
  }

  function persistSelection(h, s, l, pct) {
    const entry = {
      h: Math.round(h),
      s: Math.round(s),
      l: Math.round(l),
      pct,
      ts: Date.now(),
    };
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const list = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(list)) throw new Error('bad');
      list.push(entry);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list.slice(-300)));
      localStorage.setItem(LAST_KEY, JSON.stringify(entry));
    } catch (e) {
      localStorage.setItem(LAST_KEY, JSON.stringify(entry));
    }
    try {
      syncBc && syncBc.postMessage({ type: 'pick', ts: entry.ts });
    } catch (_) {}
  }

  const UNLOCK_MS = 4000;

  function selectColour() {
    if (locked) return;
    locked = true;
    const h = Math.round(currentHue);
    const s = Math.round(currentSat);
    const l = Math.round(currentLight);
    const pct = randomSimilarityPercent();
    persistSelection(h, s, l, pct);

    overlayLine.textContent =
      `Your colour is similar to ${pct}% of people who've been through the gallery`;
    overlay.removeAttribute('hidden');

    window.setTimeout(() => {
      overlay.setAttribute('hidden', '');
      locked = false;
    }, UNLOCK_MS);
  }

  function showErr(msg) {
    errEl.textContent = msg;
    errEl.hidden = false;
  }

  function setHint() {
    hintEl.textContent = 'Close your fist to choose.';
  }

  const hands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`,
  });
  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.65,
  });

  hands.onResults(r => {
    if (!r.multiHandLandmarks?.length) {
      handVisible = false;
      landmarks = null;
      lastCellKey = null;
      return;
    }
    handVisible = true;
    landmarks = r.multiHandLandmarks[0];
    const palm = landmarks[9];
    handX = 1 - palm.x;
    handY = palm.y;

    const tips = [8, 12, 16, 20];
    const avgDist = tips.reduce(
      (sum, i) => sum + Math.hypot(landmarks[i].x - palm.x, landmarks[i].y - palm.y),
      0
    ) / 4;
    fistClosed = avgDist < 0.08;
    if (fistClosed && !lastFist) selectColour();
    lastFist = fistClosed;
  });

  resizeHandCanvas();
  applyPaletteIndex(0);
  lastCellKey = null;
  window.addEventListener('resize', () => {
    resizeHandCanvas();
    drawHandOverlay();
  });

  const cam = new Camera(video, {
    onFrame: async () => {
      await hands.send({ image: video });
      if (!cameraReady) cameraReady = true;
      updateLiveColourFromHand();
      setHint();
      drawHandOverlay();
    },
    width: 640,
    height: 480,
  });

  cam.start().catch(() => {
    showErr('Camera unavailable — allow access and refresh, or use Space to choose the current colour.');
    cameraReady = false;
    hintEl.textContent = 'Close your fist to choose.';
  });

  document.addEventListener('keydown', e => {
    if (locked) return;
    if (e.code === 'Space') {
      e.preventDefault();
      selectColour();
      return;
    }
    if (e.code === 'ArrowRight') {
      e.preventDefault();
      lastCellKey = null;
      kbdIdx = (kbdIdx + 1) % DISTINCT_PALETTE.length;
      applyPaletteIndex(kbdIdx);
    }
    if (e.code === 'ArrowLeft') {
      e.preventDefault();
      lastCellKey = null;
      kbdIdx = (kbdIdx - 1 + DISTINCT_PALETTE.length) % DISTINCT_PALETTE.length;
      applyPaletteIndex(kbdIdx);
    }
  });

  stage.addEventListener('pointermove', e => {
    if (locked || handVisible) return;
    const r = stage.getBoundingClientRect();
    handX = (e.clientX - r.left) / r.width;
    handY = (e.clientY - r.top) / r.height;
    updateLiveColourFromHand();
  });

  setHint();
})();
</script>
</body>
</html>
